<!doctype html>
<html lang="en" data-theme="dark" data-glass="regular">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitNapse Desktop</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("gitnapse.theme");
          var preference = stored === "dark" || stored === "light" ? stored : "system";
          var dark =
            preference === "dark" ||
            (preference === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var glass = localStorage.getItem("gitnapse.glass");
          if (glass === "thin" || glass === "regular" || glass === "thick") {
            document.documentElement.dataset.glass = glass;
          }
          if (localStorage.getItem("gitnapse.transparency") === "reduce") {
            document.documentElement.dataset.transparency = "reduce";
          }
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
