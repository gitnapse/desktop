[package]
name = "gitnapse-desktop"
version = "0.1.0"
description = "Desktop interface for GitNapse (Tauri) - consumes the gitnapse core SDK in-process"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
# The GitNapse core SDK, headless (no TUI). Same provider/auth/config the CLI uses.
gitnapse = { path = "../../gitnapse", default-features = false }
# Remote data backend: typed client for the GitNapse HTTP API (gitnapse-server).
gitnapse-client = { path = "../../api/crates/gitnapse-client" }
gitnapse-protocol = { path = "../../api/crates/gitnapse-protocol" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
