[package]
name = "gitnapse-desktop"
version = "0.1.0"
description = "GitNapse desktop shell: Tauri commands delegating to gitnapse-bridge"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# All desktop logic lives in the pure-Rust bridge (no webview needed to test).
gitnapse-bridge = { path = "../bridge" }
