[workspace]
members = ["bridge", "src-tauri"]
resolver = "2"

# Debug builds of the dependencies (serde, gitnapse, tauri, …) are optimized so
# the dev app is responsive with large payloads, while workspace code stays
# cheap to rebuild and debuggable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Shared release profile for the bridge (and the Tauri shell at bundle time).
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
